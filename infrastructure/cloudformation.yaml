AWSTemplateFormatVersion: "2010-09-09"
Description: FastAPI Tasks API on AWS Lambda behind API Gateway HTTP API.

Parameters:
  ArtifactBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment ZIP.

  ArtifactKey:
    Type: String
    Description: Object key of the Lambda deployment ZIP in ArtifactBucket.

  ArtifactVersion:
    Type: String
    Default: ""
    Description: Optional S3 object version ID. Set this when reusing an existing ArtifactKey.

Conditions:
  HasArtifactVersion: !Not [!Equals [!Ref ArtifactVersion, ""]]

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  TasksFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: TasksTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt TasksTable.Arn

  TasksFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-tasks"
      Description: FastAPI Tasks POC.
      Runtime: python3.14
      Architectures:
        - x86_64
      Handler: app.main.handler
      Role: !GetAtt TasksFunctionRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
        S3ObjectVersion: !If [HasArtifactVersion, !Ref ArtifactVersion, !Ref "AWS::NoValue"]
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          TASKS_TABLE_NAME: !Ref TasksTable
      TracingConfig:
        Mode: Active

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http-api"
      ProtocolType: HTTP

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TasksFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"

  RootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /"
      Target: !Join
        - /
        - - integrations
          - !Ref LambdaIntegration

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "ANY /{proxy+}"
      Target: !Join
        - /
        - - integrations
          - !Ref LambdaIntegration

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: "$default"
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  AllowApiGatewayInvokeFunction:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TasksFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*"

Outputs:
  ApiUrl:
    Description: Public API endpoint URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  FunctionName:
    Description: Lambda function name.
    Value: !Ref TasksFunction

  TasksTableName:
    Description: DynamoDB table used to persist tasks.
    Value: !Ref TasksTable
