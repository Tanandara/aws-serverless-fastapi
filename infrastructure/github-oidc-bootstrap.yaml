AWSTemplateFormatVersion: "2010-09-09"
Description: One-time GitHub Actions OIDC bootstrap for the Tasks POC.

Parameters:
  GitHubOrganization:
    Type: String
    Description: GitHub user or organization that owns the repository.

  GitHubRepository:
    Type: String
    Description: Repository name only, without the organization.

  GitHubBranch:
    Type: String
    Default: main
    Description: The only branch allowed to deploy.

  ArtifactBucketName:
    Type: String
    Description: Globally unique S3 bucket name for Lambda ZIP artifacts.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${GitHubRepository}-github-actions-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrganization}/${GitHubRepository}:ref:refs/heads/${GitHubBranch}"
      # Deliberately broad for this learning POC. Replace with a least-privilege
      # policy or a CloudFormation service role before production use.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket

  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsDeployRole.Arn
