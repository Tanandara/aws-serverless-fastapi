[project]
name = "aws-serverless-fastapi-sam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.40.0",
    "fastapi>=0.141.1",
    "mangum>=0.21.0",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
aws-serverless-fastapi-sam = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
