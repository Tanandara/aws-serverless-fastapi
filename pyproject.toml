[project]
name = "aws-serverless-fastapi-sam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanandara", email = "tanandara.ketkeo@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "mangum>=0.21.0",
]

[project.scripts]
aws-serverless-fastapi-sam = "aws_serverless_fastapi_sam:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
